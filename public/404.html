<!doctype html>
<html lang="ml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>പേജ് കണ്ടെത്താനായില്ല (404) | ADSA ക്യാമ്പ്</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@700;800&family=Noto+Sans+Malayalam:wght@400;500&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #1E1F22;
        --card: #2A2C31;
        --blue: #2F6BFF;
        --yellow: #FFC93C;
        --text: #F4F2EC;
        --muted: #A9ABB3;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Noto Sans Malayalam', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .container {
        max-width: 520px;
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 48px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .badge {
        font-family: 'Sora', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--yellow);
        background: rgba(255, 201, 60, 0.1);
        border: 1px solid rgba(255, 201, 60, 0.25);
        padding: 6px 16px;
        border-radius: 999px;
      }
      .code {
        font-family: 'Sora', sans-serif;
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        color: #ffffff;
      }
      h1 {
        font-family: 'Anek Malayalam', sans-serif;
        font-size: 26px;
        font-weight: 700;
        color: #ffffff;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: var(--muted);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--blue);
        color: #ffffff;
        font-family: 'Anek Malayalam', sans-serif;
        font-weight: 700;
        font-size: 16px;
        padding: 12px 32px;
        border-radius: 999px;
        text-decoration: none;
        transition: background 0.2s, transform 0.2s;
        margin-top: 8px;
      }
      .btn:hover {
        background: #2558d6;
        transform: translateY(-2px);
      }
      .footer-note {
        font-family: 'Sora', sans-serif;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">ERROR 404</div>
      <div class="code">404</div>
      <h1>പേജ് കണ്ടെത്താനായില്ല</h1>
      <p>
        നിങ്ങൾ തിരഞ്ഞ വെബ്‌പേജ് നിലവിലില്ല അല്ലെങ്കിൽ മാറ്റപ്പെട്ടിരിക്കുന്നു. ADSA ക്യാമ്പ് ഹോംപേജിലേക്ക് മടങ്ങുക.
      </p>
      <a href="/" class="btn">ഹോംപേജിലേക്ക് മടങ്ങുക →</a>
      <div class="footer-note">ADSA CAMP · SUFFA DARS NETWORK</div>
    </div>
  </body>
</html>
